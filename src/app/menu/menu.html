<div class="page-background container-fluid py-5">
  <div class="book-container mx-auto">
    <div class="book-body shadow-lg">
      <div class="book-spine"></div>

      <div class="page-side page-left" #leftSide id="tour-primaria">
        <div class="page-front p-3 p-md-4">
          <header class="text-center mb-3">
            <h1 class="h4 fw-bold text-primary mb-1">Índice Primaria</h1>
            <div class="underline mx-auto"></div>
          </header>

          <div class="card border-0 shadow-sm section-card flex-grow-1 overflow-hidden">
            <div class="card-header py-2 bg-white border-bottom">
              <div class="d-flex justify-content-between align-items-center">
                <h2 class="h6 mb-0 fw-bold">🎓 Primaria</h2>
                <span class="badge rounded-pill bg-danger">Grados 4-5</span>
              </div>
            </div>
            
            <div class="scroll-container">
              <div class="list-group list-group-flush">
                <a *ngFor="let c of classesPrimary; let i = index" 
                   (click)="entrarAClase('/clase/' + c.id, leftSide, 'right')"
                   style="cursor: pointer;"
                   class="list-group-item list-group-item-action py-2">
                  <div class="d-flex align-items-center">
                    <span class="date text-secondary fw-bold small me-2" style="min-width: 45px;">{{ i + 1 }}).</span>
                    <div class="flex-grow-1">
                      <span class="d-block fw-semibold text-dark small">{{ c.titulo }}</span>
                      <small class="text-danger fw-bold" style="font-size: 0.6rem;">{{ c.tema }}</small>
                    </div>
                  </div>
                </a>
              </div>
            </div>
          </div>

          <button (click)="voltearHojaMovil(leftSide, 'right')" class="btn-next-page d-lg-none shadow-sm">
            Ver Bachillerato ➜
          </button>

          <div class="mt-3">
            <button (click)="salirPagina('/intro', leftSide, 'right')" 
                    class="btn btn-outline-dark btn-sm rounded-pill px-3 fw-bold w-100">
              <span class="d-none d-lg-inline">⬅ INTRO</span>
              <span class="d-lg-none">⬅ PILARES CLAVE</span>
            </button>
          </div>
        </div>
        <div class="page-back"></div>
      </div>

      <div class="page-side page-right" #rightSide id="tour-bachillerato">
        <div class="page-front p-3 p-md-4">
          <header class="text-center mb-3">
            <h1 class="h4 fw-bold text-primary mb-1">Bachillerato</h1>
            <div class="underline mx-auto"></div>
          </header>

          <div class="card border-0 shadow-sm section-card flex-grow-1 overflow-hidden">
            <div class="card-header py-2 bg-white border-bottom">
              <div class="d-flex justify-content-between align-items-center">
                <h2 class="h6 mb-0 fw-bold">💻 Bachillerato</h2>
                <span class="badge rounded-pill bg-primary">Grados 7-8</span>
              </div>
            </div>
            
            <div class="scroll-container">
              <div class="list-group list-group-flush">
                <a *ngFor="let c of classesSecondary; let i = index" 
                   (click)="entrarAClase('/clase/' + c.id, rightSide, 'left')"
                   style="cursor: pointer;"
                   class="list-group-item list-group-item-action py-2">
                  <div class="d-flex align-items-center">
                    <span class="date text-secondary fw-bold small me-2" style="min-width: 45px;">{{ i + 1 }}).</span>
                    <div class="flex-grow-1">
                      <span class="d-block fw-semibold text-dark small">{{ c.titulo }}</span>
                      <small class="text-primary fw-bold" style="font-size: 0.6rem;">{{ c.tema }}</small>
                    </div>
                  </div>
                </a>
              </div>
            </div>
          </div>

          <button (click)="voltearHojaMovil(rightSide, 'left', true)" class="btn-prev-page d-lg-none shadow-sm">
            ⬅ Ver Primaria
          </button>

          <div class="mt-3">
            <button (click)="salirPagina('/', rightSide, 'left')" 
                    class="btn btn-outline-danger btn-sm rounded-pill px-3 fw-bold w-100">
              🏠 INICIO
            </button>
          </div>
        </div>
        <div class="page-back"></div>
      </div>

    </div>
  </div>
</div>
